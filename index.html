<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Mermaid 생성기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.6.1/mermaid.min.js"></script>
<style>
  /* ── 다크 테마 (기본) ── */
  :root {
    --bg:        #0f1117;
    --bg-card:   #1a1d27;
    --bg-input:  #12141c;
    --border:    #2a2d3e;
    --border-hover: #3a3d5e;
    --text:      #e0e0e0;
    --text-muted:#888;
    --accent:    #7c83fd;
    --accent2:   #a78bfa;
    --code-text: #60d4f7;
    --diagram-bg:#ffffff;
    --selected-bg:#1c1730;
    --theme-icon: '☀️';
  }

  /* ── 라이트 테마 ── */
  :root.light {
    --bg:        #f4f5fb;
    --bg-card:   #ffffff;
    --bg-input:  #f0f1f8;
    --border:    #d0d3e8;
    --border-hover: #b0b3d0;
    --text:      #1a1d2e;
    --text-muted:#6b7280;
    --accent:    #5b61e8;
    --accent2:   #7c5fcf;
    --code-text: #0e7dc2;
    --diagram-bg:#ffffff;
    --selected-bg:#ede9ff;
    --theme-icon: '🌙';
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; transition: background 0.25s, color 0.25s; }

  .app { max-width: 900px; margin: 0 auto; padding: 24px 16px; }

  /* ── 헤더 + 테마 토글 ── */
  .header-row { display: flex; align-items: flex-start; justify-content: center; position: relative; margin-bottom: 4px; }
  h1 { text-align: center; font-size: 1.6rem; font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2), #60d4f7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .theme-btn { position: absolute; right: 0; top: 0; background: var(--bg-card);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
    cursor: pointer; font-size: 1.1rem; transition: all 0.2s; line-height: 1; }
  .theme-btn:hover { border-color: var(--accent); transform: scale(1.08); }

  .subtitle { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 24px; }

  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; margin-bottom: 16px; transition: background 0.25s, border-color 0.25s; }

  textarea { width: 100%; background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 0.95rem; padding: 14px;
    resize: vertical; min-height: 130px; outline: none; transition: border 0.2s, background 0.25s;
    font-family: inherit; }
  textarea:focus { border-color: var(--accent); }

  .analyze-btn { width: 100%; padding: 13px; border-radius: 10px; border: none; cursor: pointer;
    font-size: 1rem; font-weight: 600; margin-top: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; transition: opacity 0.2s; }
  .analyze-btn:hover { opacity: 0.88; }
  .analyze-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .section-title { font-size: 0.8rem; font-weight: 600; color: var(--accent); text-transform: uppercase;
    letter-spacing: 0.08em; margin-bottom: 12px; }

  .diagram-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }

  .diagram-card { background: var(--bg-input); border: 2px solid var(--border); border-radius: 12px;
    padding: 14px; cursor: pointer; transition: all 0.2s; position: relative; }
  .diagram-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .diagram-card.selected { border-color: var(--accent2); background: var(--selected-bg); }
  .diagram-card.recommended::after { content: '✨ 추천'; position: absolute; top: 8px; right: 8px;
    font-size: 0.65rem; background: color-mix(in srgb, var(--accent) 20%, transparent);
    color: var(--accent2); padding: 2px 7px; border-radius: 20px; }

  .d-icon { font-size: 1.6rem; margin-bottom: 6px; }
  .d-name { font-size: 0.9rem; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .d-desc { font-size: 0.75rem; color: var(--text-muted); line-height: 1.4; }

  .generate-btn { width: 100%; padding: 13px; border-radius: 10px; border: none; cursor: pointer;
    font-size: 1rem; font-weight: 600; margin-top: 4px;
    background: linear-gradient(135deg, #60d4f7, var(--accent)); color: #fff; transition: opacity 0.2s; }
  .generate-btn:hover { opacity: 0.88; }
  .generate-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .status { text-align: center; color: var(--accent2); font-size: 0.9rem; padding: 12px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { padding: 7px 18px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-input); color: var(--text-muted); cursor: pointer;
    font-size: 0.85rem; transition: all 0.2s; }
  .tab.active { background: color-mix(in srgb, var(--accent) 13%, transparent);
    border-color: var(--accent); color: var(--accent2); font-weight: 600; }

  .diagram-output { background: var(--diagram-bg); border-radius: 10px; padding: 20px; min-height: 200px;
    display: flex; align-items: center; justify-content: center; overflow: auto;
    border: 1px solid var(--border); }
  .diagram-output svg { max-width: 100%; height: auto; }

  .code-output { background: var(--bg-input); border-radius: 10px; padding: 16px;
    font-family: 'Courier New', monospace; font-size: 0.82rem; line-height: 1.6;
    color: var(--code-text); overflow-x: auto; white-space: pre; position: relative;
    border: 1px solid var(--border); }

  .copy-btn { position: absolute; top: 10px; right: 10px; background: var(--border);
    border: none; color: var(--accent2); padding: 5px 12px; border-radius: 6px;
    cursor: pointer; font-size: 0.78rem; transition: background 0.2s; }
  .copy-btn:hover { background: var(--border-hover); }

  .hidden { display: none; }
  .loader { display: inline-block; width: 18px; height: 18px;
    border: 2px solid color-mix(in srgb, var(--accent2) 30%, transparent);
    border-top-color: var(--accent2); border-radius: 50%;
    animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: #f87171; font-size: 0.85rem; padding: 10px; background: #f8717122; border-radius: 8px; margin-top: 10px; }

  .provider-btns { display: flex; gap: 8px; margin-bottom: 12px; }
  .provider-btn { flex: 1; padding: 9px; border-radius: 10px; border: 2px solid var(--border);
    background: var(--bg-input); color: var(--text-muted); cursor: pointer;
    font-size: 0.88rem; font-weight: 600; transition: all 0.2s; }
  .provider-btn:hover { border-color: var(--accent); color: var(--text); }
  .provider-btn.active { border-color: var(--accent2); background: var(--selected-bg); color: var(--accent2); }

  .group-header { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px;
    margin-top: 4px; margin-bottom: 2px; }
  .group-header-label { font-size: 0.75rem; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }
  .group-header-line { flex: 1; height: 1px; background: var(--border); }
  .diagram-card.extra { border-style: dashed; }
  .diagram-card.extra:hover { border-style: solid; }

  /* 선택 순서 번호 뱃지 */
  .diagram-card[data-sel-num]::before {
    content: attr(data-sel-num);
    position: absolute; top: 8px; left: 8px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); color: #fff;
    font-size: 0.72rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center; }

  /* 최대 선택 시 미선택 카드 비활성 */
  .diagram-grid[data-maxed] .diagram-card:not(.selected) {
    opacity: 0.38; cursor: not-allowed; }
  .diagram-grid[data-maxed] .diagram-card:not(.selected):hover {
    transform: none; border-color: var(--border); border-style: dashed; }

  /* 선택 카운트 힌트 */
  .select-hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 10px; text-align: center; }
  .select-hint span { color: var(--accent2); font-weight: 600; }

  /* 다이어그램 결과 아이템 */
  .result-item { border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .result-item:last-child { margin-bottom: 0; }
  .result-header { font-size: 0.92rem; font-weight: 700; color: var(--text); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .result-header .r-badge { font-size: 0.7rem; background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent2); padding: 2px 8px; border-radius: 20px; }

  /* API key input */
  #apiKeyInput { transition: background 0.25s, border-color 0.2s; }

  /* ── 다이어그램 툴바 ── */
  .diagram-toolbar { display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px; gap: 8px; flex-wrap: wrap; }
  .zoom-controls { display: flex; align-items: center; gap: 4px; }
  .zoom-btn { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 0.82rem;
    transition: all 0.15s; line-height: 1.4; }
  .zoom-btn:hover { border-color: var(--accent); color: var(--accent); }
  .zoom-level { font-size: 0.78rem; color: var(--text-muted); min-width: 38px;
    text-align: center; font-variant-numeric: tabular-nums; }
  .fullscreen-btn { margin-left: 4px; font-size: 1rem; padding: 4px 8px; }

  /* diagram-output: 스크롤 가능하도록 */
  .diagram-output { overflow: auto; }
  .zoom-wrap { display: inline-block; transform-origin: top left; transition: transform 0.15s; }

  /* ── 전체화면 모달 ── */
  .fs-modal { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; }
  .fs-modal.hidden { display: none; }
  .fs-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.75); }
  .fs-content { position: relative; margin: 24px auto; width: calc(100% - 48px); max-width: 1200px;
    max-height: calc(100vh - 48px); background: var(--bg-card); border-radius: 16px;
    border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .fs-header { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 12px; flex-wrap: wrap; }
  .fs-title { font-size: 0.95rem; font-weight: 700; color: var(--text); }
  .fs-toolbar { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .fs-close { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 8px; padding: 5px 14px; cursor: pointer; font-size: 0.85rem; font-weight: 600;
    transition: all 0.15s; margin-left: 8px; }
  .fs-close:hover { border-color: #f87171; color: #f87171; }
  .fs-diagram { flex: 1; overflow: auto; padding: 24px; display: flex;
    align-items: flex-start; justify-content: flex-start; background: var(--diagram-bg); }
  .fs-diagram .zoom-wrap svg { max-width: none; }
</style>
</head>
<body>
<div class="app">
  <div class="header-row">
    <h1>🧠 AI Mermaid 다이어그램 생성기</h1>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="테마 전환">☀️</button>
  </div>
  <p class="subtitle">텍스트를 입력하면 AI가 분석하여 시각화해드립니다</p>

  <!-- API Key Input -->
  <div class="card" id="apiKeyCard">
    <div class="section-title">🔑 API Key 입력</div>
    <div class="provider-btns">
      <button class="provider-btn active" id="providerClaude" onclick="selectProvider('claude')">🟣 Claude (Anthropic)</button>
      <button class="provider-btn" id="providerOpenai" onclick="selectProvider('openai')">🟢 OpenAI</button>
    </div>
    <div id="openaiModelRow" style="display:none;margin-bottom:10px;">
      <label style="font-size:0.8rem;color:var(--text-muted);display:block;margin-bottom:5px;">OpenAI 모델 선택</label>
      <select id="openaiModelSelect" onchange="openaiModel=this.value"
        style="width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:10px;
        color:var(--text);font-size:0.9rem;padding:10px 14px;outline:none;cursor:pointer;
        transition:border 0.2s,background 0.25s;font-family:inherit;">
        <option value="gpt-4o-mini">gpt-4o-mini — 저렴 · 빠름 ($0.15 / $0.60 per 1M)</option>
        <option value="gpt-5.4-mini">gpt-5.4-mini — 고성능 · 최신 ($0.75 / $4.50 per 1M)</option>
      </select>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <input type="password" id="apiKeyInput" placeholder="Anthropic API Key를 입력하세요 (sk-ant-...)"
        style="flex:1;background:var(--bg-input);border:1px solid var(--border);border-radius:10px;color:var(--text);
        font-size:0.9rem;padding:11px 14px;outline:none;transition:border 0.2s,background 0.25s;font-family:inherit;"
        oninput="onApiKeyChange()" onkeydown="if(event.key==='Enter')saveApiKey()"/>
      <button onclick="saveApiKey()" id="apiKeySaveBtn"
        style="padding:11px 18px;border-radius:10px;border:none;cursor:pointer;font-size:0.9rem;
        font-weight:600;background:linear-gradient(135deg,#7c83fd,#a78bfa);color:#fff;white-space:nowrap;opacity:0.45;" disabled>
        저장
      </button>
    </div>
    <div id="apiKeyStatus" style="font-size:0.78rem;color:#888;margin-top:7px;">API Key는 브라우저 메모리에만 저장되며 외부로 전송되지 않습니다.</div>
  </div>

  <!-- Step 1: Input -->
  <div class="card hidden" id="inputCard">
    <div class="section-title">① 내용 입력</div>
    <textarea id="inputText" placeholder="분석할 내용을 자유롭게 입력하세요.&#10;예) 회원가입 프로세스, 프로젝트 일정, 시스템 구조, 조직도 등...&#10;&#10;Ctrl+Enter 또는 버튼을 눌러 분석하세요."></textarea>
    <button class="analyze-btn" id="analyzeBtn" onclick="analyzeText()">🔍 AI 분석하기</button>
    <div id="analyzeError" class="error hidden"></div>
  </div>

  <!-- Step 2: Diagram Type Selection -->
  <div class="card hidden" id="typeSection">
    <div class="section-title">② 시각화 유형 선택 <span style="font-size:0.75rem;color:#888;font-weight:400;text-transform:none;letter-spacing:0">(최대 3개)</span></div>
    <div class="diagram-grid" id="diagramGrid"></div>
    <div class="select-hint" id="selectHint">유형을 선택하세요 — <span>0 / 3</span> 선택됨</div>
    <button class="generate-btn" id="generateBtn" onclick="generateDiagram()" style="margin-top:10px" disabled>
      ✨ 다이어그램 생성하기
    </button>
    <div id="generateError" class="error hidden"></div>
  </div>

  <!-- Step 3: Output -->
  <div class="card hidden" id="outputSection">
    <div class="section-title">③ 결과</div>
    <div id="resultsContainer"></div>
    <button class="analyze-btn" style="margin-top:14px; background: linear-gradient(135deg, var(--border), var(--border-hover)); color:var(--accent2);" onclick="resetAll()">🔄 처음부터 다시</button>
  </div>

  <div id="statusMsg" class="status hidden"></div>
</div>

<!-- 전체화면 모달 -->
<div class="fs-modal hidden" id="fsModal">
  <div class="fs-backdrop" onclick="closeFullscreen()"></div>
  <div class="fs-content">
    <div class="fs-header">
      <span class="fs-title" id="fsTitle"></span>
      <div class="fs-toolbar">
        <div class="zoom-controls">
          <button class="zoom-btn" onclick="zoomOut('__fs__')">−</button>
          <span class="zoom-level" id="zoomLevel___fs__">100%</span>
          <button class="zoom-btn" onclick="zoomIn('__fs__')">+</button>
          <button class="zoom-btn" onclick="zoomReset('__fs__')" title="원래 크기">↺</button>
          <button class="zoom-btn" onclick="zoomFit('__fs__')" title="너비 맞춤">↔ 맞춤</button>
        </div>
        <button class="fs-close" onclick="closeFullscreen()">✕ 닫기</button>
      </div>
    </div>
    <div class="fs-diagram" id="fsDiagram">
      <div class="zoom-wrap" id="zoomWrap___fs__"></div>
    </div>
  </div>
</div>

<script>
// ── 테마 관리 ──
function applyTheme(mode) {
  const isLight = mode === 'light';
  document.documentElement.classList.toggle('light', isLight);
  document.getElementById('themeBtn').textContent = isLight ? '🌙' : '☀️';
  // Mermaid 테마도 함께 전환
  mermaid.initialize({ startOnLoad: false, theme: isLight ? 'default' : 'default', securityLevel: 'loose' });
  localStorage.setItem('theme', mode);
}

function toggleTheme() {
  const isLight = document.documentElement.classList.contains('light');
  applyTheme(isLight ? 'dark' : 'light');
}

// 저장된 테마 또는 시스템 설정 적용
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) {
    applyTheme(saved);
  } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
    applyTheme('light');
  }
})();

mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });

const MAIN_TYPES = [
  { id: 'flowchart',    icon: '🔵', name: 'Flowchart',        desc: '프로세스 흐름, 의사결정 구조' },
  { id: 'sequence',     icon: '🟣', name: 'Sequence Diagram', desc: '시스템/사용자 간 상호작용' },
  { id: 'gantt',        icon: '🟠', name: 'Gantt Chart',      desc: '프로젝트 일정 및 타임라인' },
  { id: 'mindmap',      icon: '🟡', name: 'Mindmap',          desc: '아이디어 연결, 개념 구조화' },
  { id: 'classDiagram', icon: '🟢', name: 'Class Diagram',    desc: '객체지향 구조, 관계 모델' },
  { id: 'stateDiagram', icon: '🔴', name: 'State Diagram',    desc: '상태 변화, 이벤트 흐름' },
  { id: 'erDiagram',    icon: '🩵', name: 'ER Diagram',       desc: '데이터베이스 관계 모델' },
];

const EXTRA_TYPES = [
  { id: 'journey',             icon: '🧭', name: 'User Journey',         desc: '사용자 경험 단계, UX 시나리오' },
  { id: 'timeline',            icon: '📅', name: 'Timeline',             desc: '역사/이벤트 시간순 정리' },
  { id: 'gitGraph',            icon: '🌿', name: 'Git Graph',            desc: '브랜치 전략, 커밋 히스토리' },
  { id: 'pie',                 icon: '🥧', name: 'Pie Chart',            desc: '비율/구성 데이터 시각화' },
  { id: 'quadrantChart',       icon: '🎯', name: 'Quadrant Chart',       desc: '2x2 우선순위 매트릭스' },
  { id: 'requirementDiagram',  icon: '📋', name: 'Requirement Diagram',  desc: '요구사항 추적, 기능 명세' },
];

const DIAGRAM_TYPES = [...MAIN_TYPES, ...EXTRA_TYPES];

let selectedTypes = [];  // 최대 3개
let currentCodes = {};   // { typeId: code }
let zoomLevels = {};     // { typeId: number }
let analysisResult = null;
let apiKey = '';
let provider = 'claude'; // 'claude' | 'openai'
let openaiModel = 'gpt-4o-mini';

const PROVIDER_CONFIG = {
  claude: {
    placeholder: 'Anthropic API Key를 입력하세요 (sk-ant-...)',
    validate: v => v.startsWith('sk-ant-'),
    hint: '❌ Anthropic 키는 sk-ant- 로 시작해야 합니다.',
  },
  openai: {
    placeholder: 'OpenAI API Key를 입력하세요 (sk-...)',
    validate: v => v.startsWith('sk-') && !v.startsWith('sk-ant-'),
    hint: '❌ OpenAI 키는 sk- 로 시작해야 합니다 (sk-ant- 제외).',
  },
};

function selectProvider(p) {
  provider = p;
  document.getElementById('providerClaude').classList.toggle('active', p === 'claude');
  document.getElementById('providerOpenai').classList.toggle('active', p === 'openai');
  document.getElementById('apiKeyInput').placeholder = PROVIDER_CONFIG[p].placeholder;
  
  // localStorage에서 저장된 키 가져오기
  const savedKey = localStorage.getItem('mermaid_api_key_' + p);
  document.getElementById('apiKeyInput').value = savedKey || '';
  
  onApiKeyChange();
  document.getElementById('openaiModelRow').style.display = p === 'openai' ? 'block' : 'none';
  localStorage.setItem('mermaid_last_provider', p);
}

function onApiKeyChange() {
  const val = document.getElementById('apiKeyInput').value.trim();
  const valid = PROVIDER_CONFIG[provider].validate(val);
  const saveBtn = document.getElementById('apiKeySaveBtn');
  saveBtn.disabled = !valid;
  saveBtn.style.opacity = valid ? '1' : '0.45';
  
  if (val.length > 6 && !valid) {
    document.getElementById('apiKeyStatus').textContent = PROVIDER_CONFIG[provider].hint;
    document.getElementById('apiKeyStatus').style.color = '#f87171';
  } else {
    document.getElementById('apiKeyStatus').textContent = 'API Key는 브라우저의 localStorage에 안전하게 저장됩니다.';
    document.getElementById('apiKeyStatus').style.color = '#888';
  }
}

function saveApiKey() {
  const val = document.getElementById('apiKeyInput').value.trim();
  if (!PROVIDER_CONFIG[provider].validate(val)) return;
  apiKey = val;
  
  // localStorage에 저장
  localStorage.setItem('mermaid_api_key_' + provider, val);
  if (provider === 'openai') {
    localStorage.setItem('mermaid_openai_model', openaiModel);
  }

  const label = provider === 'claude' ? 'Claude (Anthropic)' : 'OpenAI';
  document.getElementById('apiKeyStatus').textContent = `✅ ${label} API Key가 설정되었습니다.`;
  document.getElementById('apiKeyStatus').style.color = '#34d399';
  document.getElementById('inputCard').classList.remove('hidden');
  document.getElementById('inputText').focus();
}

// 초기 로드 시 저장된 설정 불러오기
(function initApiSettings() {
  const lastProvider = localStorage.getItem('mermaid_last_provider') || 'claude';
  const savedModel = localStorage.getItem('mermaid_openai_model');
  
  if (savedModel) {
    openaiModel = savedModel;
    document.getElementById('openaiModelSelect').value = savedModel;
  }
  
  selectProvider(lastProvider);
  
  // 만약 현재 공급자의 키가 이미 있다면 자동으로 '저장' 버튼을 누른 효과 (UI 표시)
  const savedKey = localStorage.getItem('mermaid_api_key_' + lastProvider);
  if (savedKey && PROVIDER_CONFIG[lastProvider].validate(savedKey)) {
    saveApiKey();
  }
})();

document.addEventListener('DOMContentLoaded', () => {
  // 엔터키 처리 등 기존 리스너는 그대로 유지
  document.getElementById('apiKeyInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveApiKey();
  });
  // Ctrl+Enter or Cmd+Enter to analyze
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      const inputCard = document.getElementById('inputCard');
      if (!inputCard.classList.contains('hidden')) analyzeText();
    }
  });
});

async function callAI(messages, systemPrompt) {
  if (!apiKey) throw new Error('API Key가 설정되지 않았습니다.');

  if (provider === 'claude') {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-beta': 'prompt-caching-2024-07-31',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1000,
        // cache_control으로 시스템 프롬프트를 캐시 대상으로 지정
        // 동일 세션 내 반복 호출 시 해당 토큰을 원가의 10%만 과금
        system: [{ type: 'text', text: systemPrompt, cache_control: { type: 'ephemeral' } }],
        messages
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data.content.map(b => b.text || '').join('');

  } else {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: openaiModel,
        max_completion_tokens: 1000,
        messages: [{ role: 'system', content: systemPrompt }, ...messages]
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data.choices[0].message.content || '';
  }
}

async function analyzeText() {
  const text = document.getElementById('inputText').value.trim();
  if (!text) return;

  setStatus('분석 중...', true);
  document.getElementById('analyzeBtn').disabled = true;
  document.getElementById('analyzeError').classList.add('hidden');

  try {
    const systemPrompt = `You are a diagram type recommender. Given user text, analyze it and return JSON only.
Return this exact JSON structure (no markdown, no explanation):
{
  "summary": "한 줄 요약 (한국어)",
  "recommended": ["flowchart","sequence","gantt","mindmap","classDiagram","stateDiagram","erDiagram"],
  "reasons": {
    "flowchart": "이 유형이 적합한 이유 (한국어, 1줄)",
    "sequence": "...",
    "gantt": "...",
    "mindmap": "...",
    "classDiagram": "...",
    "stateDiagram": "...",
    "erDiagram": "..."
  }
}
The "recommended" array must contain ALL 7 types sorted from most to least suitable.`;

    const raw = await callAI([{ role: 'user', content: text }], systemPrompt);
    const clean = raw.replace(/```json|```/g, '').trim();
    analysisResult = JSON.parse(clean);

    buildTypeGrid(analysisResult);
    document.getElementById('typeSection').classList.remove('hidden');
    setStatus('');
  } catch (e) {
    showError('analyzeError', '분석 중 오류가 발생했습니다: ' + e.message);
    setStatus('');
  }
  document.getElementById('analyzeBtn').disabled = false;
}

function makeGroupHeader(label) {
  const el = document.createElement('div');
  el.className = 'group-header';
  el.innerHTML = `<span class="group-header-label">${label}</span><span class="group-header-line"></span>`;
  return el;
}

function makeCard(type, extraClass, reason) {
  const card = document.createElement('div');
  card.className = 'diagram-card' + (extraClass ? ' ' + extraClass : '');
  card.id = 'card_' + type.id;
  card.onclick = () => selectType(type.id);
  card.innerHTML = `<div class="d-icon">${type.icon}</div>
    <div class="d-name">${type.name}</div>
    <div class="d-desc">${reason}</div>`;
  return card;
}

function buildTypeGrid(analysis) {
  const grid = document.getElementById('diagramGrid');
  grid.innerHTML = '';
  const recommended = analysis.recommended || MAIN_TYPES.map(d => d.id);

  // ── 대표 7종 섹션 ──
  grid.appendChild(makeGroupHeader('✨ 대표 다이어그램'));
  recommended.forEach((id, i) => {
    const type = MAIN_TYPES.find(d => d.id === id);
    if (!type) return;
    const reason = analysis.reasons?.[id] || type.desc;
    grid.appendChild(makeCard(type, i === 0 ? 'recommended' : '', reason));
  });

  // ── 추가 다이어그램 섹션 ──
  grid.appendChild(makeGroupHeader('➕ 추가 다이어그램'));
  EXTRA_TYPES.forEach(type => {
    grid.appendChild(makeCard(type, 'extra', type.desc));
  });
}

function selectType(id) {
  const idx = selectedTypes.indexOf(id);
  if (idx >= 0) {
    selectedTypes.splice(idx, 1);
  } else {
    if (selectedTypes.length >= 3) return;
    selectedTypes.push(id);
  }
  updateCardSelections();
}

function updateCardSelections() {
  const grid = document.getElementById('diagramGrid');
  document.querySelectorAll('.diagram-card').forEach(c => {
    c.classList.remove('selected');
    delete c.dataset.selNum;
  });
  selectedTypes.forEach((id, i) => {
    const card = document.getElementById('card_' + id);
    if (!card) return;
    card.classList.add('selected');
    card.dataset.selNum = i + 1;
  });
  const maxed = selectedTypes.length >= 3;
  if (maxed) grid.dataset.maxed = 'true';
  else delete grid.dataset.maxed;

  const n = selectedTypes.length;
  const hint = document.getElementById('selectHint');
  hint.innerHTML = n === 0
    ? `유형을 선택하세요 — <span>${n} / 3</span> 선택됨`
    : `<span>${n}개</span> 선택됨${maxed ? ' (최대)' : ' — 추가 선택하거나 생성하세요'}`;

  const btn = document.getElementById('generateBtn');
  btn.disabled = n === 0;
  btn.textContent = n > 1
    ? `✨ 다이어그램 ${n}개 동시 생성하기`
    : '✨ 다이어그램 생성하기';
}

async function generateDiagram() {
  if (selectedTypes.length === 0) return;
  const text = document.getElementById('inputText').value.trim();
  const n = selectedTypes.length;
  setStatus(n > 1 ? `${n}개 다이어그램 병렬 생성 중...` : '다이어그램 생성 중...', true);
  document.getElementById('generateBtn').disabled = true;
  document.getElementById('generateError').classList.add('hidden');
  currentCodes = {};

  const colorGuides = {
    flowchart: `Use classDef with colors like #7c83fd, #a78bfa, #60d4f7, #f472b6, #34d399 and apply them to nodes.
Node IDs must be simple English alphanumeric (e.g. A, B, step1). Put Korean only inside brackets: A[한국어 텍스트].`,
    sequence: `STRICT RULES for sequenceDiagram:
- participant names must be single English words (e.g. User, Server, DB, UI, Auth).
- Message text after the colon can be Korean: User->>Server: 요청전송
- Do NOT put spaces or hyphens in participant names.
- Every arrow line must follow exactly: ParticipantA->>ParticipantB: messageText
- No blank participant names. No line breaks inside a message.`,
    gantt: `Use dateFormat YYYY-MM-DD. Section names and task names can be Korean.
Each task line: taskName : status, startDate, duration`,
    mindmap: `Use simple indentation. Labels can be Korean. No special characters except parentheses for shapes.`,
    classDiagram: `Class names must be English. Attributes and method names English. Add Korean comments with %% if needed.
Include relationships: <|-- for inheritance, *-- for composition, o-- for aggregation.`,
    stateDiagram: `Use stateDiagram-v2.
- State names must be single English words (e.g. Idle, Running, Error).
- Add Korean description with state X : 한국어설명 on a separate line.
- Transitions: StateA --> StateB : 한국어레이블
- Do NOT use spaces, colons, or special chars inside state name identifiers.`,
    erDiagram: `Entity names must be English. Attribute names English with Korean comments using %%.
Relationships: ENTITY1 ||--o{ ENTITY2 : "관계명"`,
    journey: `Use 'journey' as the first line. Format:
title 제목 (Korean ok)
section 단계명 (Korean ok)
  작업명: score: ActorName
Score is 1-5. ActorName must be a single English word. Section and task names can be Korean.`,
    timeline: `Use 'timeline' as the first line. Format:
title 제목 (Korean ok)
section 섹션명 (Korean ok)
  날짜 또는 기간 : 이벤트 설명
Section names, dates, and descriptions can be Korean.`,
    gitGraph: `Use 'gitGraph' as the first line.
Branch names must be short English words (main, develop, feature, hotfix).
Commit messages can be Korean: commit id:"한국어 메시지"
Use commit, branch, checkout, merge keywords only.`,
    pie: `Use 'pie' as the first line, then 'title 제목'.
Each data line: "항목명" : 숫자
Labels can be Korean in double quotes. Values are positive numbers. Include 4-8 items.`,
    quadrantChart: `Use 'quadrantChart' as the first line. Format:
x-axis 낮음 --> 높음
y-axis 낮음 --> 높음
quadrant-1 사분면명
quadrant-2 사분면명
quadrant-3 사분면명
quadrant-4 사분면명
항목명: [x, y]
x and y values are 0.0–1.0. Item names and axis labels can be Korean.`,
    requirementDiagram: `Use 'requirementDiagram' as the first line.
Requirement IDs and element names must be English. Descriptions can be Korean.
Format: requirement ReqName { id: R1; text: "한국어 설명"; risk: high; verifymethod: test }
element ElementName { type: "시스템"; docref: "문서" }
ElementName - satisfies -> ReqName`,
  };

  // 선택된 각 타입을 병렬로 생성
  const buildPrompt = (typeId) => `You are a Mermaid diagram code generator.
Generate ONLY valid Mermaid ${typeId} diagram code based on the user's content.

DIAGRAM-SPECIFIC RULES:
${colorGuides[typeId] || ''}

GLOBAL RULES:
- Output ONLY raw Mermaid code. Zero explanation, zero markdown fences, zero backticks.
- The very first line must be the diagram type keyword only (e.g. "flowchart LR" or "sequenceDiagram").
- Never use quotes around participant/node identifiers.
- Korean text is allowed ONLY inside labels/descriptions, never in identifiers or keywords.
- Make the diagram detailed and meaningful based on the content.`;

  try {
    // 결과 컨테이너 미리 구성 (로딩 상태)
    buildResultItems(selectedTypes);

    // 병렬 생성
    const results = await Promise.allSettled(
      selectedTypes.map(typeId =>
        callAI([{ role: 'user', content: text }], buildPrompt(typeId))
          .then(raw => raw.trim().replace(/^```[a-z]*\n?|```$/g, '').trim())
      )
    );

    // 각 결과 렌더링
    for (let i = 0; i < selectedTypes.length; i++) {
      const typeId = selectedTypes[i];
      const result = results[i];
      if (result.status === 'fulfilled') {
        currentCodes[typeId] = result.value;
        document.getElementById('codeText_' + typeId).textContent = result.value;
        await renderDiagram(result.value, typeId);
      } else {
        const out = document.getElementById('diagramOutput_' + typeId);
        if (out) out.innerHTML = `<div style="color:#f87171;font-size:0.85rem">생성 실패: ${result.reason?.message || '알 수 없는 오류'}</div>`;
      }
    }

    document.getElementById('outputSection').classList.remove('hidden');
    document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth' });
    setStatus('');
  } catch (e) {
    showError('generateError', '생성 중 오류: ' + e.message);
    setStatus('');
  }
  document.getElementById('generateBtn').disabled = false;
}

function buildResultItems(typeIds) {
  const container = document.getElementById('resultsContainer');
  container.innerHTML = '';
  document.getElementById('outputSection').classList.remove('hidden');

  typeIds.forEach((typeId, i) => {
    const type = DIAGRAM_TYPES.find(d => d.id === typeId);
    const item = document.createElement('div');
    item.className = 'result-item';
    item.innerHTML = `
      <div class="result-header">
        ${type.icon} ${type.name}
        <span class="r-badge">${i + 1}번째</span>
      </div>
      <div class="tabs" id="tabs_${typeId}">
        <div class="tab active" onclick="switchResultTab('${typeId}', 'preview')">👁 미리보기</div>
        <div class="tab" onclick="switchResultTab('${typeId}', 'code')">📋 코드</div>
      </div>
      <div id="preview_${typeId}">
        <div class="diagram-toolbar">
          <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomOut('${typeId}')">−</button>
            <span class="zoom-level" id="zoomLevel_${typeId}">100%</span>
            <button class="zoom-btn" onclick="zoomIn('${typeId}')">+</button>
            <button class="zoom-btn" onclick="zoomReset('${typeId}')" title="원래 크기">↺</button>
            <button class="zoom-btn" onclick="zoomFit('${typeId}')" title="너비 맞춤">↔ 맞춤</button>
          </div>
          <button class="zoom-btn fullscreen-btn" onclick="openFullscreen('${typeId}')" title="전체화면">⛶</button>
        </div>
        <div class="diagram-output" id="diagramOutput_${typeId}">
          <div style="color:var(--text-muted)"><span class="loader"></span> 생성 중...</div>
        </div>
      </div>
      <div id="code_${typeId}" class="hidden">
        <div class="code-output" style="position:relative">
          <button class="copy-btn" onclick="copyCode('${typeId}')">복사</button>
          <span id="codeText_${typeId}"></span>
        </div>
      </div>`;
    container.appendChild(item);
  });
}

async function renderDiagram(code, typeId, retryCount = 0) {
  const output = document.getElementById('diagramOutput_' + typeId);
  if (!output) return;
  try {
    const id = 'mermaid_' + typeId + '_' + Date.now();
    const { svg } = await mermaid.render(id, code);
    output.innerHTML = `<div class="zoom-wrap" id="zoomWrap_${typeId}">${svg}</div>`;
    // 초기 zoom 유지 (재렌더 시) 또는 1로 초기화
    setZoom(typeId, zoomLevels[typeId] || 1);
  } catch (e) {
    if (retryCount < 2) {
      output.innerHTML = `<div style="color:#a78bfa;font-size:0.85rem"><span class="loader"></span> 오류 감지 → 자동 수정 중... (${retryCount + 1}/2)</div>`;
      try {
        const fixed = await fixMermaidCode(code, e.message);
        currentCodes[typeId] = fixed;
        const codeEl = document.getElementById('codeText_' + typeId);
        if (codeEl) codeEl.textContent = fixed;
        await renderDiagram(fixed, typeId, retryCount + 1);
      } catch (e2) {
        output.innerHTML = `<div style="color:#f87171;font-size:0.85rem">자동 수정 실패: ${e2.message}<br><br>코드 탭에서 직접 확인하세요.</div>`;
      }
    } else {
      output.innerHTML = `<div style="color:#f87171;font-size:0.85rem">렌더링 실패 (2회 시도): ${e.message}<br><br>코드 탭에서 확인하세요.</div>`;
    }
  }
}

async function fixMermaidCode(code, errorMsg) {
  const systemPrompt = `You are a Mermaid diagram syntax expert.
The user has a broken Mermaid diagram. Fix ALL syntax errors and return ONLY the corrected Mermaid code.
Rules:
- Output raw Mermaid code only. No markdown fences, no backticks, no explanation.
- Keep all content and structure intact, only fix syntax.
- For stateDiagram-v2: labels must NOT contain colons (:) inside state names — use spaces or hyphens instead.
- For stateDiagram-v2: transition labels after --> use colon syntax: StateA --> StateB : label
- Korean text is allowed but must not break syntax tokens.
- Remove or escape any characters that conflict with Mermaid parsing.`;

  const userMsg = `Mermaid code with error:\n${code}\n\nError message:\n${errorMsg}\n\nPlease fix and return only the corrected Mermaid code.`;
  const fixed = await callAI([{ role: 'user', content: userMsg }], systemPrompt);
  return fixed.trim().replace(/^```[a-z]*\n?|```$/g, '').trim();
}

function switchResultTab(typeId, tab) {
  const tabEls = document.querySelectorAll(`#tabs_${typeId} .tab`);
  tabEls.forEach((t, i) => t.classList.toggle('active', (tab === 'preview' && i === 0) || (tab === 'code' && i === 1)));
  document.getElementById('preview_' + typeId).classList.toggle('hidden', tab !== 'preview');
  document.getElementById('code_' + typeId).classList.toggle('hidden', tab !== 'code');
}

function copyCode(typeId) {
  const code = currentCodes[typeId] || '';
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.querySelector(`#code_${typeId} .copy-btn`);
    if (btn) { btn.textContent = '✅ 복사됨'; setTimeout(() => btn.textContent = '복사', 1500); }
  });
}

function resetAll() {
  selectedTypes = []; currentCodes = {}; zoomLevels = {}; analysisResult = null;
  document.getElementById('inputText').value = '';
  document.getElementById('typeSection').classList.add('hidden');
  document.getElementById('outputSection').classList.add('hidden');
  document.getElementById('resultsContainer').innerHTML = '';
  document.getElementById('statusMsg').classList.add('hidden');
  document.getElementById('generateBtn').disabled = true;
  closeFullscreen();
  document.getElementById('inputText').focus();
}

// ── 줌 컨트롤 ──
function setZoom(typeId, level) {
  zoomLevels[typeId] = level;
  const wrap = document.getElementById('zoomWrap_' + typeId);
  if (wrap) wrap.style.transform = `scale(${level})`;
  const display = document.getElementById('zoomLevel_' + typeId);
  if (display) display.textContent = Math.round(level * 100) + '%';
}

function zoomIn(typeId) {
  setZoom(typeId, Math.min(4, (zoomLevels[typeId] || 1) + 0.25));
}

function zoomOut(typeId) {
  setZoom(typeId, Math.max(0.25, (zoomLevels[typeId] || 1) - 0.25));
}

function zoomReset(typeId) {
  setZoom(typeId, 1);
}

function zoomFit(typeId) {
  const wrap = document.getElementById('zoomWrap_' + typeId);
  const output = document.getElementById('diagramOutput_' + typeId) ||
                 document.getElementById('fsDiagram');
  if (!wrap || !output) return;
  // 일시적으로 scale(1)로 리셋하여 자연 크기 측정
  wrap.style.transform = 'scale(1)';
  const svg = wrap.querySelector('svg');
  if (!svg) return;
  const svgW = svg.getBoundingClientRect().width;
  const containerW = output.clientWidth - 48;
  const fitScale = Math.min(4, Math.max(0.25, containerW / svgW));
  setZoom(typeId, fitScale);
}

// ── 전체화면 ──
function openFullscreen(typeId) {
  const type = DIAGRAM_TYPES.find(d => d.id === typeId);
  const srcWrap = document.getElementById('zoomWrap_' + typeId);
  if (!srcWrap) return;

  // SVG 복사 후 모달에 삽입
  const fsWrap = document.getElementById('zoomWrap___fs__');
  fsWrap.innerHTML = srcWrap.innerHTML;
  fsWrap.style.transform = 'scale(1)';
  zoomLevels['__fs__'] = 1;
  document.getElementById('zoomLevel___fs__').textContent = '100%';
  document.getElementById('fsTitle').textContent = type ? `${type.icon} ${type.name}` : '';
  document.getElementById('fsModal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  // 자동으로 너비 맞춤
  requestAnimationFrame(() => zoomFit('__fs__'));
}

function closeFullscreen() {
  document.getElementById('fsModal').classList.add('hidden');
  document.body.style.overflow = '';
}

// ESC 키로 모달 닫기
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeFullscreen();
});

function setStatus(msg, loading = false) {
  const el = document.getElementById('statusMsg');
  if (!msg) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  el.innerHTML = loading ? `<span class="loader"></span>${msg}` : msg;
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.remove('hidden');
}
